name: VK feed sync

on:
  schedule:
    - cron: "0 4 * * *"   # 07:00 МСК ежедневно
  workflow_dispatch:       # ручной запуск: Actions → VK feed sync → Run workflow

permissions:
  contents: write

concurrency:
  group: vk-feed-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Moscow
      MACRO_FEED_URL: ${{ secrets.MACRO_FEED_URL }}
      NOVOSTROY_FEED_URL: ${{ secrets.NOVOSTROY_FEED_URL }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT: ${{ secrets.TG_CHAT }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync feed
        run: |
          set +e
          python3 vk_feed_sync.py --feed docs/vk_feed.xml --log sync_log.md
          code=$?
          # Журнал коммитим всегда: так видна история и репозиторий не засыпает (GitHub
          # отключает расписание после 60 дней без коммитов)
          git config user.name "vk-feed-bot"
          git config user.email "vk-feed-bot@users.noreply.github.com"
          git add docs/*.xml sync_log.md
          git commit -m "sync $(date +%F)" && git push
          exit $code
